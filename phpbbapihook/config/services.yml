services:
    ecyaz.phpbbapihook.credential_manager:
        class: ecyaz\phpbbapihook\api\credential_manager
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%apihook_keys'

    ecyaz.phpbbapihook.logger:
        class: ecyaz\phpbbapihook\api\logger
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%apihook_log'

    ecyaz.phpbbapihook.responder:
        class: ecyaz\phpbbapihook\api\responder

    ecyaz.phpbbapihook.authenticator:
        class: ecyaz\phpbbapihook\api\authenticator
        arguments:
            - '@config'
            - '@request'
            - '@user'
            - '@auth'
            - '@dbal.conn'
            - '@ecyaz.phpbbapihook.credential_manager'
            - '@ecyaz.phpbbapihook.logger'
            - '%core.table_prefix%users'

    ecyaz.phpbbapihook.registry:
        class: ecyaz\phpbbapihook\api\registry
        arguments:
            - '@dispatcher'
            - '@ext.manager'

    # Public entry point for other extensions: inject it as
    # '@?ecyaz.phpbbapihook.gateway' and call handle().
    ecyaz.phpbbapihook.gateway:
        class: ecyaz\phpbbapihook\api\gateway
        arguments:
            - '@ecyaz.phpbbapihook.authenticator'
            - '@ecyaz.phpbbapihook.responder'
            - '@ecyaz.phpbbapihook.logger'
            - '@ecyaz.phpbbapihook.registry'
            - '@request'
            - '@symfony_request'
            - '@user'
            - '@dispatcher'

    ecyaz.phpbbapihook.content_renderer:
        class: ecyaz\phpbbapihook\api\content_renderer
        arguments:
            - '%core.root_path%'
            - '%core.php_ext%'

    ecyaz.phpbbapihook.controller.topics:
        class: ecyaz\phpbbapihook\controller\topics
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@content.visibility'
            - '@ecyaz.phpbbapihook.content_renderer'
            - '%core.root_path%'
            - '%core.php_ext%'

    ecyaz.phpbbapihook.controller.forums:
        class: ecyaz\phpbbapihook\controller\forums
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@auth'
            - '@dbal.conn'
            - '@content.visibility'

    ecyaz.phpbbapihook.controller.posts:
        class: ecyaz\phpbbapihook\controller\posts
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@auth'
            - '@dbal.conn'
            - '@content.visibility'
            - '@ecyaz.phpbbapihook.content_renderer'

    ecyaz.phpbbapihook.controller.meta:
        class: ecyaz\phpbbapihook\controller\meta
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@auth'

    ecyaz.phpbbapihook.controller.search:
        class: ecyaz\phpbbapihook\controller\search
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@content.visibility'
            - '@ecyaz.phpbbapihook.content_renderer'
            - '@dispatcher'
            - '%core.root_path%'
            - '%core.php_ext%'

    ecyaz.phpbbapihook.controller.extensions:
        class: ecyaz\phpbbapihook\controller\extensions
        arguments:
            - '@ecyaz.phpbbapihook.gateway'
            - '@ecyaz.phpbbapihook.responder'
            - '@request'
            - '@user'
            - '@ecyaz.phpbbapihook.registry'

    ecyaz.phpbbapihook.cron.prune_log:
        class: ecyaz\phpbbapihook\cron\prune_log
        arguments:
            - '@config'
            - '@ecyaz.phpbbapihook.logger'
        calls:
            - [set_name, [cron.task.ecyaz.phpbbapihook.prune_log]]
        tags:
            - { name: cron.task }
